<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokTok Block</title>
<meta name="description" content="TokTok Block, a block puzzle game for Android">
<style>
  :root { --bg: #19214d; --card: #232c63; --text: #eef0fa; --muted: #aab1d6; --accent: #ffd43b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(110% 60% at 50% -10%, rgba(125, 150, 255, 0.45), transparent 65%), linear-gradient(#2b3b82, var(--bg) 55%, #10152f);
    color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { width: min(480px, 100%); padding: 32px 16px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
  h1 { margin: 20px 0 4px; font-size: 32px; }
  p { margin: 0 0 8px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
  a { display: block; padding: 12px 16px; border-radius: 14px; background: var(--card); color: var(--text); text-decoration: none; }
  a:hover { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<main>
  <img src="toktok-block/icon.png" alt="TokTok Block icon">
  <h1>TokTok Block</h1>
  <p>톡톡 블록 · Block puzzle game for Android</p>
  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.toktokblock.game">Google Play</a></li>
    <li><a href="toktok-block/privacy.html">Privacy Policy · 개인정보처리방침</a></li>
    <li><a href="mailto:siantree25@gmail.com">siantree25@gmail.com</a></li>
  </ul>
</main>
</body>
</html>
